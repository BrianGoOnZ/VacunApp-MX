<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - VacunApp MX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tu CSS -->
    <link rel="stylesheet" href="css/recuperar.css.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <div class="container-fluid">
            <div class="logo">
                VacunApp <span class="mx">MX</span>
            </div>
        </div>
    </header>

    <!-- CONTENIDO -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card-recuperar">

            <h2>Recuperar contraseña</h2>
            <p>
                Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <form>
                <input type="email" placeholder="Correo electrónico" required>

                <button type="submit" class="btn-azul">
                    Enviar enlace
                </button>
            </form>

            <a href="login.html" class="volver">
                Volver al inicio de sesión
            </a>

        </div>
    </div>

</body>
</html>
