<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VacunApp MX - Centros</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style-index.css">
    <link rel="stylesheet" href="css/centros.css">
</head>
<body class="bg-vapp">

    <header class="header-vapp">
        </header>

    <div class="container">
        <div class="row">
            <div class="col-xs-12 text-center">
                <h1 class="bienvenida-centros">CENTROS CERCANOS</h1>
                <div class="linea-azul"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
                
                <div class="card-centro-vapp">
                    <div class="card-contenido">
                        <div class="centro-img-container">
                            <img src="img-medios-VApp/secre-salud.webp" alt="Hospital">
                        </div>
                        <div class="centro-texto">
                            <h3>Hospital General 450</h3>
                            <p>Av. Universidad S/N, Durango, Dgo.</p>
                            <p>Horario: 08:00 AM - 08:00 PM</p>
                        </div>
                        <div class="centro-acciones">
                            <span class="badge-vacunas">Vacunas Disponibles</span>
                            <a href="#" class="link-mapa">Ver en Mapa</a>
                        </div>
                    </div>
                </div>

                <div class="card-centro-vapp">
                    <div class="card-contenido">
                        <div class="centro-img-container">
                            <img src="img-medios-VApp/clinica-dgo.webp" alt="IMSS">
                        </div>
                        <div class="centro-texto">
                            <h3>Clínica IMSS No. 1</h3>
                            <p>Predio Canoas, Durango, Dgo.</p>
                            <p>Horario: 24 Horas</p>
                        </div>
                        <div class="centro-acciones">
                            <span class="badge-vacunas">Vacunas Disponibles</span>
                            <a href="#" class="link-mapa">Ver en Mapa</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
