<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VacunApp MX - Centros</title>

    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style-index.css">
    <link rel="stylesheet" href="css/centros.css">
</head>
<body class="bg-vapp">

    <header class="header-vapp">
        <div class="container-fluid">
            <div class="row display-flex-center">
                <div class="col-xs-6">
                    <div class="logo-container">
                        <img src="img-medios-VApp/escudo-vapp.png" alt="Logo" class="logo-img">
                        <span class="logo-text">VacunApp <span class="mx">MX</span></span>
                    </div>
                </div>
                <div class="col-xs-6 text-right">
                    <nav class="nav-vapp">
                        <ul class="nav-links">
                            <li class="active"><a href="centros.html">Centros</a></li>
                        </ul>
                        <div class="nav-icons">
                            <span class="glyphicon glyphicon-menu-hamburger"></span>
                            <span class="glyphicon glyphicon-user"></span>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="bienvenida">Centros Cercanos</div>

        <div class="row">
            <div class="col-md-8 col-md-offset-2">
                
                <div class="card-hospital">
                    <div class="row display-flex-center">
                        <div class="col-sm-3 text-center">
                            <div class="foto-placeholder">
                                <img src="img-medios-VApp/secre-salud.webp" class="img-centro" alt="Hospital">
                            </div>
                        </div>
                        <div class="col-sm-6 info-centro">
                            <h3 class="nombre-centro">Hospital General 450</h3>
                            <p>Av. Universidad S/N, Durango, Dgo.</p>
                            <p>Horario: 08:00 AM - 08:00 PM</p>
                        </div>
                        <div class="col-sm-3 text-center action-area">
                            <span class="label-vacunas">Vacunas Disponibles</span>
                            <a href="#" class="link-mapa">Ver en Mapa</a>
                        </div>
                    </div>
                </div>

                <div class="card-hospital">
                    <div class="row display-flex-center">
                        <div class="col-sm-3 text-center">
                            <div class="foto-placeholder">
                                <img src="img-medios-VApp/clinica-dgo.webp" class="img-centro" alt="Clínica">
                            </div>
                        </div>
                        <div class="col-sm-6 info-centro">
                            <h3 class="nombre-centro">Clínica IMSS No. 1</h3>
                            <p>Predio Canoas, Durango, Dgo.</p>
                            <p>Horario: 24 Horas</p>
                        </div>
                        <div class="col-sm-3 text-center action-area">
                            <span class="label-vacunas">Vacunas Disponibles</span>
                            <a href="#" class="link-mapa">Ver en Mapa</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
