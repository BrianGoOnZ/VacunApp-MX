<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VacunApp MX - Notificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style-notificaciones.css">
</head>
<body>
  <header>
    <div class="container-fluid">
      <div class="logo">
        VacunApp <span class="mx">MX</span>
      </div>
      <div>
        <ul class="nav nav-tabs">
          <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
          <li class="nav-item"><a href="vacunas.html" class="nav-link">Vacunas</a></li>
          <li class="nav-item"><a href="calendario.html" class="nav-link">Calendario</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Escanear</a></li>
          <li class="nav-item"><a href="notificaciones.html" class="nav-link active">Notificaciones</a></li>
          <li class="nav-item"><a href="centros.html" class="nav-link">Centros</a></li>
        </ul>
      </div>
    </div>
  </header>
    <main class="container py-5">
        <section class="titulo-notificaciones text-center">
            <h1>Notificaciones</h1>
        </section>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <article class="card-notificacion mb-4">
                    <div class="card-header-vapp d-flex justify-content-between align-items-center">
                        <span>Recordatorios</span>
                        <button class="btn-close-vapp">✕</button>
                    </div>
                    <div class="card-body-vapp p-3">
                        <p class="m-0 text-muted">No tienes recordatorios pendientes.</p>
                    </div>
                </article>
                <article class="card-notificacion mb-4">
                    <div class="card-header-vapp d-flex justify-content-between align-items-center">
                        <span>Mensajes</span>
                        <button class="btn-close-vapp">✕</button>
                    </div>
                    <div class="card-body-vapp p-3">
                        <p class="m-0 text-muted">Tienes un mensaje del sector salud.</p>
                    </div>
                </article>
                <article class="card-notificacion mb-4">
                    <div class="card-header-vapp d-flex justify-content-between align-items-center">
                        <span>Información Educativa</span>
                        <button class="btn-close-vapp">✕</button>
                    </div>
                    <div class="card-body-vapp p-3">
                        <p class="m-0 text-muted">Nueva campaña de vacunación disponible.</p>
                    </div>
                </article>
            </div>
        </div>
    </main>
</body>
</html>
