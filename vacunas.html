<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VacunApp MX - Mis Vacunas</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">  
    <link rel="stylesheet" href="css/style-index.css">
    <link rel="stylesheet" href="css/disvacunas.css">
</head>
<body>
    <header>
        <div class="container-fluid">
            <div class="logo">
                VacunApp <span class="mx">MX</span>
            </div>
            <nav class="navbar_menu">
                <a href="index.html" class="menu">Inicio</a>
                <a href="vacunas.html" class="menu active">Vacunas</a>
                <a href="#" class="menu">Calendario</a>
                <a href="#" class="menu">Centros</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="bienvenida">Mis Vacunas</div>
        <div class="container">
            <div class="row">         
                <div class="col-sm-4">
                    <div class="card-info">
                        <button class="btn-iniciarsesion" data-toggle="modal" data-target="#modalAgregarVacuna">
                            + Añadir vacuna
                        </button>
                        <button class="btn-iniciarsesion">
                            + Recordatorio
                        </button>
                    </div>
                </div>
                <div class="col-sm-8">
                    <div class="card-educativa tabla-contenedor">
                        <div class="table-responsive">
                            <table class="tabla-vapp">
                                <thead>
                                    <tr>
                                        <th class="col-azul-claro">Vacuna</th>
                                        <th>ENFERMEDAD QUE PREVIENE</th>
                                        <th>DOSIS</th>
                                        <th>EDAD Y FRECUENCIA</th>
                                        <th>FECHA</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                                    <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                                    <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                                    <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="modalAgregarVacuna" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content card-educativa modal-vapp">                
                <div class="card-header">
                    <span>NUEVA VACUNA</span>
                    <button type="button" class="btn-cerrar" data-dismiss="modal">X</button>
                </div>             
                <div class="modal-body">
                    <form>
                        <div class="form-group">
                            <label>Nombre de la Vacuna:</label>
                            <input type="text" class="form-control" placeholder="Ej. Influenza">
                        </div>
                        <div class="form-group">
                            <label>Enfermedad:</label>
                            <input type="text" class="form-control" placeholder="Ej. Gripe">
                        </div>
                        <div class="row">
                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label>Dosis:</label>
                                    <input type="text" class="form-control" placeholder="1ra, 2da...">
                                </div>
                            </div>
                            <div class="col-xs-6">
                                <div class="form-group">
                                    <label>Fecha:</label>
                                    <input type="date" class="form-control">
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn-iniciarsesion" style="width: 100%; margin: 1em 0 0 0;" data-dismiss="modal">
                            Cerrar Formulario
                        </button>
                    </form>
                </div>       
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
