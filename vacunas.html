<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VacunApp MX - Mis Vacunas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style-index.css">
    <link rel="stylesheet" href="css/disvacunas.css">
</head>
<body>
  <header>
    <div class="container-fluid">
      <div class="logo">
        VacunApp <span class="mx">MX</span>
      </div>
      <div>
        <ul class="nav nav-tabs">
          <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
          <li class="nav-item"><a href="vacunas.html" class="nav-link active">Vacunas</a></li>
          <li class="nav-item"><a href="calendario.html" class="nav-link">Calendario</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Escanear</a></li>
          <li class="nav-item"><a href="notificaciones.html" class="nav-link">Notificaciones</a></li>
          <li class="nav-item"><a href="centros.html" class="nav-link">Centros</a></li>
        </ul>
      </div>
    </div>
  </header>
  <main>
    <div class="bienvenida text-center mt-4">MIS VACUNAS</div>   
    <div class="container mt-5">
      <div class="row">         
        <div class="col-md-3 mb-4">
          <div class="d-grid gap-3">
            <button class="btn-iniciarsesion" data-bs-toggle="modal" data-bs-target="#modalAgregarVacuna">
              + Añadir vacuna
            </button>
            <button class="btn-iniciarsesion" data-bs-toggle="modal" data-bs-target="#modalRecordatorio">
              + Recordatorio
            </button>
          </div>
        </div>
        <div class="col-md-9">
          <div class="table-responsive shadow-sm">
            <table class="tabla-vapp">
              <thead>
                <tr>
                  <th class="col-azul-claro">Vacuna</th>
                  <th>ENFERMEDAD QUE PREVIENE</th>
                  <th>DOSIS</th>
                  <th>EDAD Y FRECUENCIA</th>
                  <th>FECHA</th>
                </tr>
              </thead>
              <tbody>
                <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
                <tr><td class="col-azul-claro"></td><td></td><td></td><td></td><td></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div class="modal fade" id="modalAgregarVacuna" tabindex="-1" aria-labelledby="modalVacunaLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content modal-vapp">
        <div class="modal-header">
          <h5 class="modal-title" id="modalVacunaLabel">NUEVA VACUNA</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label class="form-label">Nombre de la Vacuna:</label>
              <input type="text" class="form-control" placeholder="Ej. Influenza">
            </div>
            <div class="mb-3">
              <label class="form-label">Enfermedad:</label>
              <input type="text" class="form-control" placeholder="Ej. Gripe">
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Dosis:</label>
                <input type="text" class="form-control" placeholder="1ra, 2da...">
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Fecha:</label>
                <input type="date" class="form-control">
              </div>
            </div>
            <button type="submit" class="btn-iniciarsesion w-100 mt-2">Guardar Vacuna</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="modalRecordatorio" tabindex="-1" aria-labelledby="modalRecordatorioLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content modal-vapp">
        <div class="modal-header">
          <h5 class="modal-title" id="modalRecordatorioLabel">NUEVO RECORDATORIO</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label class="form-label">Título:</label>
              <input type="text" class="form-control" placeholder="Ej. Cita Centro de Salud">
            </div>
            <div class="mb-3">
              <label class="form-label">Fecha del recordatorio:</label>
              <input type="date" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Nota adicional:</label>
              <textarea class="form-control" rows="2" placeholder="Ej. No olvidar cartilla"></textarea>
            </div>
            <button type="submit" class="btn-iniciarsesion w-100 mt-2">Crear Recordatorio</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
