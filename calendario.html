<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>VacunApp MX - Calendario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/calendario.css">
</head>
<body>
  <header>
    <div class="container-fluid">
      <div class="logo">
        VacunApp <span class="mx">MX</span>
      </div>
      <div>
        <ul class="nav nav-tabs">
          <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
          <li class="nav-item"><a href="vacunas.html" class="nav-link">Vacunas</a></li>
          <li class="nav-item"><a href="calendario.html" class="nav-link active">Calendario</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Escanear</a></li>
          <li class="nav-item"><a href="notificaciones.html" class="nav-link">Notificaciones</a></li>
          <li class="nav-item"><a href="centros.html" class="nav-link">Centros</a></li>
        </ul>
      </div>
    </div>
  </header>
    <div class="container mt-5">
        <h2 class="text-center titulo mb-4">Calendario</h2>
        <div class="row">
            <div class="col-12 col-md-3 mb-4">
                <button class="btn btn-azul w-100 mb-3" data-bs-toggle="modal" data-bs-target="#modalFecha">
                    Añadir fecha
                </button>
                <button class="btn btn-azul w-100" data-bs-toggle="modal" data-bs-target="#modalRecordatorio">
                    Recordatorio
                </button>
            </div>

            <div class="col-12 col-md-9">
                <div class="table-responsive">
                    <table class="table table-bordered text-center calendario-tabla">
                        <thead class="encabezado">
                            <tr>
                                <th>L</th> <th>M</th> <th>M</th> <th>J</th> <th>V</th> <th>S</th> <th>D</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="dia">1</td> <td class="dia-claro">2</td> <td class="dia">3</td>
                                <td class="dia-claro">4</td> <td class="dia">5</td> <td class="dia-claro">6</td>
                                <td class="dia">7</td>
                            </tr>
                            <tr>
                                <td class="dia-claro">8</td> <td class="dia">9</td> <td class="dia-claro">10</td>
                                <td class="dia">11</td> <td class="dia-claro">12</td> <td class="dia">13</td>
                                <td class="dia-claro">14</td>
                            </tr>
                            <tr>
                                <td class="dia">15</td> <td class="dia-claro">16</td> <td class="dia">17</td>
                                <td class="dia-claro">18</td> <td class="dia">19</td> <td class="dia-claro">20</td>
                                <td class="dia">21</td>
                            </tr>
                            <tr>
                                <td class="dia">22</td> <td class="dia-claro">23</td> <td class="dia">24</td>
                                <td class="dia-claro">25</td> <td class="dia">26</td> <td class="dia-claro">27</td>
                                <td class="dia">28</td>
                            </tr>
                            <tr>
                                <td class="dia-claro">29</td> <td class="dia">30</td> <td class="dia-claro">31</td>
                                <td colspan="4" class="dia-vacio"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalFecha" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-vapp text-white">
                    <h5 class="modal-title">Añadir Fecha de Vacuna</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nombre de vacuna</label>
                        <input type="text" class="form-control" placeholder="Ej. Influenza">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-azul">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalRecordatorio" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-vapp text-white">
                    <h5 class="modal-title">Agregar Recordatorio</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <input type="text" class="form-control" placeholder="Ej. Cita en el centro de salud">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha del recordatorio</label>
                        <input type="date" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-azul">Guardar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
