<html lang="es">
<head>

    <!-- Bootstrap 5 -->

    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style2.css">
    <link rel="stylesheet" href="css/style3.css">
</head>

<body>

<!-- NAVBAR RESPONSIVE -->


    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Vacunas</a></li>

        <li class="nav-item"><a class="nav-link" href="#">Centros</a></li>
      </ul>

<!-- CONTENIDO PRINCIPAL -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">

      <div class="card shadow-lg border-0">
        <div class="card-body p-4">

          <h3 class="text-center mb-4">Crear Nuevo Perfil</h3>

          <form>

            <div class="mb-3">
              <label class="form-label">Nombre(s)</label>
              <input type="text" class="form-control" placeholder="Ingresa tu nombre">
            </div>

            <div class="mb-3">
              <label class="form-label">Apellido materno</label>
              <input type="text" class="form-control" placeholder="Ingresa tu apellido">
            </div>

            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="ejemplo@gmail.com">
            </div>

            <div class="mb-3">
              <label class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" placeholder="********">
            </div>

            <div class="mb-3">
              <label class="form-label">Confirmar contraseña</label>
              <input type="password" class="form-control" placeholder="********">
            </div>

            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-primary btn-lg">
                Crear Cuenta
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
