<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VacunApp MX - Crear Perfil</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
        <div class="navbar">
            <div class="navbar_menu">

                <a href="index.html" class="menu">Inicio</a>
                <a href="#" class="menu">Vacunas</a>
                <a href="#" class="menu">Calendario</a>
                <a href="#" class="menu">Escaner</a>
                <a href="#" class="menu">Centros</a>

            </div>
        </div>

    <div class="home-screen">
        <h1 class="text_bienvenida">Crear Nuevo Perfil</h1>
        
        <div class="tarjeta-registro">
            <form action="#">
                <div class="campo-f">
                    <label>Nombre(s):</label>
                    <input type="text" class="input-v">
                </div>

                <div class="campo-f">
                    <label>Apellido materno:</label>
                    <input type="text" class="input-v">
                </div>

                <div class="campo-f">
                    <label>Apellido paterno:</label>
                    <input type="text" class="input-v">
                </div>

                <div class="campo-f">
                    <label>Fecha de nacimiento:</label>
                    <input type="date" class="input-v">
                </div>

                <div class="campo-f">
                    <label>Curp:</label>
                    <input type="text" class="input-v">
                </div>

                <button type="button" class="btn-gris-foto">Subir foto de perfil</button>
                <button type="submit" class="btn-azul-continuar">Continuar</button>
                
                <br>
                <a href="index.html" style="color: #4a90e2; font-size: 14px;">Volver al inicio</a>
            </form>
        </div>
    </div>

</body>
</html>
