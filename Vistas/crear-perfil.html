 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Styles/crear-perfil.css.css">
</head>
<body>
  <header>
    <div class="container-fluid">
      <div class="logo">
        VacunApp <span class="mx">MX</span>
      </div>
    </div>
  </header>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card-custom">
            <h2 class="text-center mb-4">Crear Nuevo Perfil</h2>
            <form>
                <input type="text" class="form-control mb-3" placeholder="Nombre(s)">
                <input type="text" class="form-control mb-3" placeholder="Apellido materno">
                <input type="text" class="form-control mb-3" placeholder="Apellido paterno">
                <input type="date" class="form-control mb-3">
                <input type="text" class="form-control mb-3" placeholder="CURP">
                <button type="button" class="btn-secondary-custom w-100 mb-2">
                    Subir foto de perfil
                </button>
                <button type="submit" class="btn-primary-custom w-100">
                    Continuar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
